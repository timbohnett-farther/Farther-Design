<!-- "Your Farther advisor" closing block. Paste on the last page of every report, directly above the disclosure. personalize.js fills every data-advisor field. -->
<div data-advisor-closing style="background:#FFFFFF;border:1px solid #E3D3C5;border-radius:12px;padding:22px 24px;display:flex;align-items:center;gap:20px">
<div data-advisor="headshot-wrap" style="width:76px;height:76px;border-radius:50%;background:#C5CFD4;overflow:hidden;flex:none"><img data-advisor="headshot" alt="" style="width:100%;height:100%;object-fit:cover;object-position:top;display:block"></div>
<div style="flex:1;display:flex;flex-direction:column;gap:4px;min-width:0"><div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9F8E75">Your Farther advisor</div><div data-advisor="name" style="font-family:'ABC Arizona Text',Georgia,serif;font-weight:300;font-size:24px;color:#31465C">Advisor Name</div><div data-advisor="title" style="font-size:13px;color:#5B6A71">Title</div><div style="font-size:13px;color:#333333;margin-top:4px">Questions about this report? Let's talk it through together.</div></div>
<div style="display:flex;flex-direction:column;gap:4px;font-size:13.5px;text-align:right;color:#333333"><span data-advisor="email">email@farther.com</span><span data-advisor="phone">(000) 000-0000</span><span data-advisor="location">City, ST</span></div>
</div>
