<!-- @dsCard group="Imagery" viewport="700x400" name="Image library browser" subtitle="All 196 brand images — filter by category, click to copy path" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Farther image library</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { margin: 0; background: var(--surface-canvas, #F8F4F0); font-family: var(--font-sans, sans-serif); color: var(--fg-primary, #333); }
  header { position: sticky; top: 0; z-index: 2; background: var(--surface-canvas, #F8F4F0); padding: 18px 22px 12px; border-bottom: 1px solid #E3D3C5; }
  h1 { font-family: var(--font-display, serif); font-weight: 300; font-size: 26px; margin: 0 0 10px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filters button { font-family: var(--font-sans, sans-serif); font-size: 13px; padding: 7px 14px; border-radius: 9999px; border: 1px solid #E3D3C5; background: #fff; color: #333; cursor: pointer; transition: background 160ms ease-out, color 160ms ease-out; }
  .filters button:hover { background: #F1E9E1; }
  .filters button.on { background: #3B5A69; border-color: #3B5A69; color: #F8F4F0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; padding: 16px 22px 40px; }
  figure { margin: 0; cursor: pointer; }
  figure img { width: 100%; aspect-ratio: 3/2; object-fit: cover; border-radius: 8px; display: block; border: 1px solid rgba(51,51,51,.08); }
  figcaption { font-size: 10.5px; color: #6F6A64; padding: 4px 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #333; color: #F8F4F0; font-size: 13px; padding: 9px 16px; border-radius: 9999px; opacity: 0; pointer-events: none; transition: opacity 160ms ease-out; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Image library</h1>
  <div class="filters" id="filters"></div>
</header>
<div class="grid" id="grid"></div>
<div class="toast" id="toast">Copied</div>
<script>
  const CATS = {
    all: 'All',
    advisors: 'Advisors and work',
    families: 'Families and lifestyle',
    landscapes: 'Landscapes and nature',
    architecture: 'Cities and architecture',
    abstract: 'Thematic and abstract',
    details: 'Still life and details'
  };
  let items = [];
  let active = localStorage.getItem('farther-imglib-cat') || 'all';
  const grid = document.getElementById('grid');
  const filters = document.getElementById('filters');
  function render() {
    grid.innerHTML = '';
    items.filter(m => active === 'all' || m.category === active).forEach(m => {
      const fig = document.createElement('figure');
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.src = 'assets/images/thumbs/' + m.slug + '.jpg';
      img.alt = m.slug;
      const cap = document.createElement('figcaption');
      cap.textContent = m.slug + ' · ' + m.outW + '×' + m.outH;
      fig.appendChild(img);
      fig.appendChild(cap);
      fig.title = 'Click to copy: assets/images/library/' + m.slug + '.jpg';
      fig.addEventListener('click', () => {
        navigator.clipboard.writeText('assets/images/library/' + m.slug + '.jpg').then(() => {
          const t = document.getElementById('toast');
          t.classList.add('show');
          setTimeout(() => t.classList.remove('show'), 1200);
        });
      });
      grid.appendChild(fig);
    });
  }
  function renderFilters() {
    filters.innerHTML = '';
    Object.entries(CATS).forEach(([key, label]) => {
      const b = document.createElement('button');
      const n = key === 'all' ? items.length : items.filter(m => m.category === key).length;
      b.textContent = label + (items.length ? ' · ' + n : '');
      b.className = key === active ? 'on' : '';
      b.addEventListener('click', () => { active = key; localStorage.setItem('farther-imglib-cat', key); renderFilters(); render(); });
      filters.appendChild(b);
    });
  }
  fetch('assets/images/manifest.json').then(r => r.json()).then(d => { items = d; renderFilters(); render(); });
</script>
</body>
</html>
