<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../styles.css">
<script src="../../_ds_bundle.js"></script>
<style>
body{margin:0;background:#e9e5e0;display:flex;justify-content:center;padding:28px 0}
a{color:#3B5A69}a:hover{color:#31465C}
</style></helmet>

<div style="width:612px;height:792px;box-sizing:border-box;background:#F8F4F0;color:#333;font-family:'Fakt Pro','Fakt',system-ui,sans-serif;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(51,51,51,.04),0 8px 24px rgba(51,51,51,.06)">

  <div style="position:relative;height:396px;overflow:hidden;background:#31465C">
    <img src="{{ image }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block">
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(51,51,51,.62) 0%,rgba(51,51,51,.34) 46%,rgba(51,51,51,.14) 100%)"></div>
    <div style="position:absolute;top:44px;left:48px;right:48px;display:flex;flex-direction:column;gap:14px">
      <img src="../assets/wordmark-iw-light.svg" alt="Farther" style="width:112px;display:block;">
      <div style="font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#F8F4F0;font-weight:500;max-width:420px;line-height:1.5">{{ series }}: {{ topic }}</div>
    </div>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:44px 48px 40px">
    <div style="display:flex;flex-direction:column;gap:20px">
      <div style="font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#9F8E75">Client education guide</div>
      <div style="font-family:'ABC Arizona Text','Arizona Text',Georgia,serif;font-weight:300;font-size:38px;line-height:1.08;letter-spacing:-.03em;color:#333;max-width:460px;text-wrap:pretty">{{ topic }}</div>
      <div style="font-size:13.5px;line-height:1.45;color:#5B6A71;max-width:430px;text-wrap:pretty">{{ deck }}</div>
      <div style="height:1px;background:#E3D3C5"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;max-width:516px">
        <div style="display:flex;flex-direction:column;gap:7px"><div style="font-family:'ABC Arizona Text','Arizona Text',Georgia,serif;font-weight:300;font-size:32px;line-height:1;letter-spacing:-.03em;color:#3B5A69">{{ stat1 }}</div><div style="font-size:9.5px;line-height:1.4;color:#5B6A71;text-wrap:pretty">{{ stat1Label }}</div></div>
        <div style="display:flex;flex-direction:column;gap:7px"><div style="font-family:'ABC Arizona Text','Arizona Text',Georgia,serif;font-weight:300;font-size:32px;line-height:1;letter-spacing:-.03em;color:#3B5A69">{{ stat2 }}</div><div style="font-size:9.5px;line-height:1.4;color:#5B6A71;text-wrap:pretty">{{ stat2Label }}</div></div>
        <div style="display:flex;flex-direction:column;gap:7px"><div style="font-family:'ABC Arizona Text','Arizona Text',Georgia,serif;font-weight:300;font-size:32px;line-height:1;letter-spacing:-.03em;color:#3B5A69">{{ stat3 }}</div><div style="font-size:9.5px;line-height:1.4;color:#5B6A71;text-wrap:pretty">{{ stat3Label }}</div></div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px">
      <div style="height:1px;background:#E3D3C5"></div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end">
        <div style="font-size:10px;color:#5B6A71">Farther Wealth Management · farther.com</div>
        <div style="font-size:8px;letter-spacing:.06em;color:#9F8E75">{{ compliance }}</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:612,&quot;height&quot;:792},&quot;topic&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Direct indexing&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;deck&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Own more of the market, pay less in taxes, and keep the difference working for you.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;stat1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;35%&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Headline stats&quot;},&quot;stat1Label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Lower annual tax bill in the illustration inside&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Headline stats&quot;},&quot;stat2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1–3%&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Headline stats&quot;},&quot;stat2Label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Potential lift in annual after-tax return&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Headline stats&quot;},&quot;stat3&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;$205k+&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Headline stats&quot;},&quot;stat3Label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Potential 20-yr gain from reinvesting $5k/yr saved&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Headline stats&quot;},&quot;compliance&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;DirectIndexing-07-31-26&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      series: this.props.series ?? "Intelligent wealth strategies",
      topic: this.props.topic ?? "Direct indexing",
      deck: this.props.deck ?? "Own more of the market, pay less in taxes, and keep the difference working for you.",
      compliance: this.props.compliance ?? "DirectIndexing-07-31-26",
      image: this.props.image ?? "assets/topic/01.jpg",
      stat1: this.props.stat1 ?? "35%",
      stat1Label: this.props.stat1Label ?? "Lower annual tax bill in the illustration inside",
      stat2: this.props.stat2 ?? "1–3%",
      stat2Label: this.props.stat2Label ?? "Potential lift in annual after-tax return",
      stat3: this.props.stat3 ?? "$205k+",
      stat3Label: this.props.stat3Label ?? "Potential 20-yr gain from reinvesting $5k/yr saved"
    };
  }
}
</script>
</body>
</html>
