<!doctype html>
<html><head><meta charset="utf-8"><title>Library overflow audit</title>
<style>body{font:13px system-ui;margin:16px;color:#333}a{color:#3B5A69}a:hover{color:#31465C}iframe{position:absolute;left:-9999px;width:900px;height:1200px}.bad{color:#CE3657;font-weight:600}.ok{color:#3B5A69}</style></head>
<body><div id="out">Loading…</div>
<script>
(async()=>{
  const lists={
    'pieces':LIST_ALL
  };
  const rows=[];
  for(const [dir,files] of Object.entries(lists)){
    for(const f of files){
      const fr=document.createElement('iframe');fr.src=dir+'/'+encodeURIComponent(f);document.body.appendChild(fr);
      await new Promise(r=>fr.onload=r);await new Promise(r=>setTimeout(r,1800));
      const d=fr.contentDocument;
      const pages=[...d.querySelectorAll('section.page, [data-print-root] > div:not([data-nav])')];
      const bad=pages.map((p,i)=>{const fit=p.querySelector('[data-fit]');if(fit){const s=(fit.getBoundingClientRect().height)/(fit.scrollHeight||1);return fit.scrollHeight*0.72>fit.clientHeight-8?`p${i+1} beyond auto-fit`:null}return p.scrollHeight>p.clientHeight+2?`p${i+1} +${p.scrollHeight-p.clientHeight}px`:null}).filter(Boolean);
      const slot=d.querySelectorAll('[data-advisor-slot]').length;
      rows.push(`<div class="${bad.length||slot<1?'bad':'ok'}">${dir}/${f} — slots:${slot} ${bad.length?'OVERFLOW '+bad.join(', '):'fits'}</div>`);
      fr.remove();
      document.getElementById('out').innerHTML=rows.join('');
    }
  }
  document.getElementById('out').innerHTML+='<div>Done.</div>';
})();
</script></body></html>
