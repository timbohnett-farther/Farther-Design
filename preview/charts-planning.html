<!-- @dsCard group="Charts" viewport="700x1120" name="Planning charts" subtitle="Monte Carlo fan, cash-flow timeline, tax bracket fill" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Planning charts</title>
<link rel="stylesheet" href="../styles.css">
<script src="../assets/charts/farther-charts.js"></script>
<script src="../assets/charts/farther-charts-examples.js"></script>
<style>body{margin:0;padding:18px 24px;background:#F8F4F0;font-family:'Fakt Pro','Fakt',system-ui,sans-serif;color:#333;display:flex;flex-direction:column;gap:18px}a{color:#3B5A69}a:hover{color:#31465C}
.eye{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#9F8E75}.ttl{font-family:'ABC Arizona Text',Georgia,serif;font-weight:300;font-size:16px;color:#3B5A69;margin:2px 0 8px}.fn{font-size:9px;color:#8A8A8A;font-family:ui-monospace,monospace}</style></head><body>
<div><div style="display:flex;justify-content:space-between;align-items:baseline"><div class="eye">Monte Carlo fan</div><div class="fn">FartherCharts.fan(el, spec)</div></div><div class="ttl">Projected portfolio value</div><div id="fan"></div></div>
<div><div style="display:flex;justify-content:space-between;align-items:baseline"><div class="eye">Cash-flow timeline</div><div class="fn">FartherCharts.cashflow(el, spec)</div></div><div class="ttl">Retirement cash flow</div><div id="cashflow"></div></div>
<div><div style="display:flex;justify-content:space-between;align-items:baseline"><div class="eye">Tax bracket fill</div><div class="fn">FartherCharts.brackets(el, spec)</div></div><div class="ttl">Filling the 24% bracket</div><div id="brackets"></div></div>
<div style="font-size:8.5px;color:#8A8A8A">Hypothetical data for design reference.</div>
<script>["fan","cashflow","brackets"].forEach(k=>FartherCharts[k](document.getElementById(k), FARTHER_CHART_EXAMPLES[k]));</script>
</body></html>
